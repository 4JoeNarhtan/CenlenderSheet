<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="image.png" type="image/x-icon">
    <title>To-Do List with Calendar</title>
</head>

<body>
    <div class="Call_classandIDhere"></div>
    <div class="waves"></div>
    <div class="container">
        <main class="main_container">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <section id="calendar_section">
                <div id="calendar">
                    <div id="month" class="month">
                        <i class="fas fa-angle-left" id="prev"></i>
                        <div id="month-year">March 2025</div>
                        <i class="fas fa-angle-right" id="next"></i>
                    </div>
                    <div id="days" class="days">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div id="dates" class="dates"></div>
                    <div class="date_submit_footer">
                        <div class="input-group">
                            <input type="text" class="input" id="Date" name="Date" placeholder="MM/DD/YYYY"
                                autocomplete="off" disabled>
                            <input class="button--submit" id="button" value="Today" type="submit">
                        </div>
                        <div class="day_time">
                            <p class="time">00:0:00</p>
                        </div>
                    </div>
            </section>
            <section id="events-section">
                <div id="DateEvent_list" class="DateEvent_list">
                    <nav class="dateEevent_day">
                        <h2 class="dateEvent_days" id="dateEvent_days">Sun</h2>
                        <p class="dateEvent_day_time" id="dateEvent_day_time">13 November 2025</p>
                      </nav>
                    <p id="no-events-message">No events</p>
                    <main class="Eevent_list">
                        <ul>
                            <!-- <li>
                                <i class="fa-solid fa-circle"></i>
                                <div class="text-container" id="text-container">
                                    <span id="title_event">Hydrate</span>
                                    <div>
                                        <label for="day_time" id="from_day_time">6:10 -</label>
                                        <label for="day_time" id="to_day_time">7:10 AM/PM</label>
                                    </div>
                                </div>
                                <i class="fa-solid fa-pen-to-square" id="edit_event"></i>
                            </li> -->
                        </ul>
                    </main>
                </div>

                <aside>
                    <div id="add-event-form" style="display: none;">
                        <div class="card-title">
                            <h2>Add Event</h2>
                            <i class="fa-solid fa-eraser" id="clear_input"></i>
                        </div>
                        <hr>
                        <div class="form-check">
                            <div class="form-group">
                                <input type="text" id="event-title" placeholder="Add event Title" />
                            </div>
                            <div class="form-group">
                                <input type="text" id="event-time-to" class="event-input" placeholder="00:00 -" />
                            </div>
                            <div class="form-group">
                                <input type="text" id="event-time-from" class="event-input" placeholder="00:00" />
                            </div>
                        </div>
                        <button id="submit-event" class="event-btn">Submit</button>
                    </div>
                    <div class="togglebutton">
                        <button id="resetEventsBtn" class="reset-btn">
                            <i class="fas fa-undo"></i> Reset
                        </button>
                        <div>
                            <button id="closeEventBtn" class="EventBtn"><i class="fa-solid fa-minus"></i></button>
                            <button id="Addevent" class="EventBtn"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                </aside>
            </section>
        </main>
    </div>
</body>
<script src="Script.js"></script>

</html>
